services:
  # ── GPAW Engine ────────────────────────────────────────────────
  engine-gpaw:
    build:
      context: ./docker-engines
      dockerfile: engines/gpaw/Dockerfile
    image: timequant/engine-gpaw:latest
    container_name: tq-engine-gpaw
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    profiles: ["gpaw", "all"]

  # ── Quantum ESPRESSO Engine ────────────────────────────────────
